[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-orchestrator"
version = "0.1.0"
description = "Role-based agents on different models argue in rounds until they all accept one answer. Telegram bot and CLI."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Kyrylo Kalashnyk" }]
dependencies = ["httpx>=0.27,<1", "pyyaml>=6,<7", "aiogram>=3.13,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[project.scripts]
orchestrator = "orchestrator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
